# V2 review candidate; no activation authority
schema_version: 2
application:
  name: wallpaper
  kind: web
  display_name: "Wallpaper Animation Studio"
  group: "Personal"
source:
  branch: main
  repository: "zageabb/wallpaper"
static:
  output_dir: "."
  publication: atomic-symlink
  base_path: /apps/wallpaper/
proxy:
  enabled: true
  upstream: static
  canonical_path: /apps/wallpaper/
  authentication: uda
environment:
  required: []
deployment:
  strategy: static
  approval: explicit
  auto_update: false
  rollback: true
  github_reporting: false
