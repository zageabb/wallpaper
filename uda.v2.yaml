# V2 review candidate; no activation authority
schema_version: 2
application:
  name: wallpaper
  kind: web
  display_name: "Wallpaper Animation Studio"
  group: "Personal"
source:
  branch: main
  repository: "zageabb/wallpaper"
builds:
  - name: stage-public
    toolchain: static
    working_dir: .
    commands:
      - ["python3", "tools/uda_stage_static.py"]
    output_dir: build/uda-public
    artifact:
      path: build/uda-public
      kind: static
      base_path: /apps/wallpaper/
      activate: atomic-symlink
static:
  output_dir: build/uda-public
  publication: atomic-symlink
  base_path: /apps/wallpaper/
proxy:
  enabled: true
  upstream: static
  canonical_path: /apps/wallpaper/
  authentication: uda
environment:
  required: []
deployment:
  strategy: static
  approval: explicit
  auto_update: false
  rollback: true
  github_reporting: false
