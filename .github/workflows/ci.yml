name: CI
# Trigger refresh: validate current main after connector-authored commits.

on:
  workflow_dispatch:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: JavaScript syntax
        run: node --check app.js
      - name: Required files and DOM hooks
        shell: bash
        run: |
          set -euo pipefail
          test -s index.html
          test -s styles.css
          test -s app.js
          test -s DEVELOPMENT.md
          test -s AGENTS.md
          grep -q 'id="stage"' index.html
          grep -q 'id="overlay"' index.html
          grep -q 'id="particles"' index.html
          grep -q 'loopSeconds:15' app.js
