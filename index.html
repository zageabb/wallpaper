<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Wallpaper Animation Studio</title><link rel="stylesheet" href="styles.css">
</head>
<body>
<header><strong>Wallpaper Animation Studio</strong><span>Dormant scene + deterministic overlays</span></header>
<main>
<section class="stage-wrap"><div id="stage">
<img id="bg" alt="">
<svg id="overlay" viewBox="0 0 1000 562.5" preserveAspectRatio="none">
<defs>
 <filter id="softGlow" x="-50%" y="-50%" width="200%" height="200%"><feGaussianBlur stdDeviation="7"/></filter>
 <filter id="hotGlow" x="-100%" y="-100%" width="300%" height="300%"><feGaussianBlur stdDeviation="3" result="b"/><feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge></filter>
</defs>
<g id="paths"></g><g id="particles"></g><polyline id="draft" fill="none"/>
</svg>
<div id="empty">Load the dormant master wallpaper to begin</div>
</div></section>
<aside>
<label class="file">Load dormant master<input id="file" type="file" accept="image/png,image/jpeg"></label>
<div class="row"><button id="newRoute">New route</button><button id="undo">Undo point</button></div>
<label>Route name<input id="name" value="Flow 1"></label>
<label>Colour<select id="colour"><option value="#00b7ff">Electric blue</option><option value="#ffb84a">Warm gold</option></select></label>
<label>Speed <output id="speedOut">1.0×</output><input id="speed" type="range" min=".2" max="3" step=".1" value="1"></label>
<label>Width <output id="widthOut">5</output><input id="width" type="range" min="1" max="12" step="1" value="5"></label>
<label>Brightness <output id="brightnessOut">80%</output><input id="brightness" type="range" min="20" max="100" step="5" value="80"></label>
<label>Packets <output id="packetsOut">4</output><input id="packetsCount" type="range" min="1" max="10" step="1" value="4"></label>
<label class="check"><input id="reverse" type="checkbox"> Reverse direction</label>
<div class="row"><button id="finish">Finish route</button><button id="preview">Preview</button></div>
<h3>Routes</h3><div id="routes"></div>
<div class="row"><button id="save">Export JSON</button><label class="smallfile">Import JSON<input id="loadProject" type="file" accept=".json"></label></div>
<p class="hint">Click along a dormant circuit track. Double-click to finish. Preview adds energy without altering the master image.</p>
</aside></main><script src="app.js"></script></body></html>
